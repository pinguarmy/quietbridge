name: windows

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/cache@v4
        with:
          path: |
            models
            samples
          key: models-${{ hashFiles('setup.ps1') }}
      - name: setup.ps1 (dependencies, models, sample clips, Start menu shortcut)
        shell: pwsh
        run: ./setup.ps1 -Samples
      - name: Shortcut points at the venv's pythonw
        shell: pwsh
        run: |
          $lnk = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Lipflow.lnk"
          $t = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
          Write-Host $t
          if (-not (Test-Path $t)) { throw "shortcut target missing: $t" }
      - name: Tests (includes reading a real clip on the CPU)
        run: uv run pytest -q -rs
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Browser contracts and deliberate-fault sensitivity (silent rehearsal)
        shell: pwsh
        run: |
          $env:PYTHON_BIN = (Resolve-Path .venv/Scripts/python.exe).Path
          $env:CHROME_BIN = Join-Path $env:ProgramFiles "Google/Chrome/Application/chrome.exe"
          if (-not (Test-Path $env:CHROME_BIN)) { throw "Chrome missing; browser contracts were not checked" }
          node scripts/check_web.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check_web.mjs --calibrate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check_web.mjs --keyboard-profile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: lipflow doctor (no camera on CI, so this only prints)
        shell: pwsh
        run: uv run lipflow doctor; exit 0
      - name: Lip-read a sample video end to end
        run: uv run lipflow file samples/2016-03-12.mov --start 20.4 --end 28.1 --cleanup basic
