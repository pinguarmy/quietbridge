[project]
name = "lipflow"
version = "0.1.0"
description = "QuietBridge: local-first assistive communication. Silent lip movements, sign concepts and personal gestures become reviewable text, then local speech. Includes the original Lipflow silent-dictation app."
requires-python = ">=3.11,<3.13"
dependencies = [
    "anthropic>=0.40",
    "av>=18.1.0",
    "mediapipe==0.10.21",
    "mlx-lm>=0.31.3; sys_platform == 'darwin'",  # local cleanup model (Apple Silicon)
    "numpy<2",
    "opencv-python>=4.9,<4.11",
    "pillow>=10; sys_platform == 'win32'",  # tray icon and overlay video
    "pynput>=1.7.7",
    "pystray>=0.19; sys_platform == 'win32'",
    "pyobjc-framework-avfoundation>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-cocoa>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=10.3; sys_platform == 'darwin'",
    "requests>=2.31",
    "pyyaml>=6",  # lipflow/cloud.py: optional read-only CPA key lookup in ~/.dsh/.credentials.yaml (legacy Lipflow cleanup)
    "sentencepiece>=0.2.2",
    "sounddevice>=0.5.6",
    "torch>=2.4",
]

[project.scripts]
lipflow = "lipflow.__main__:main"
quietbridge = "hackathon.server:main"  # same as `python -m hackathon.server`

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Hatchling ships every non-ignored file under these directories, including
# hackathon/ui/*, hackathon/vocabulary.json, hackathon/signs/lab.html and labels.json.
packages = ["lipflow", "espnet", "hackathon"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
